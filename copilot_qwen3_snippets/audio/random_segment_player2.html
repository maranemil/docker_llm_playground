<!DOCTYPE html>
<html>
   <head>
   
   <!--
   https://onecompiler.com/html/44nvygptq

      <title>WAV Segment Player</title>
      <link rel="stylesheet" href="styles.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/latin.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <style>
         body {   
         font-family: system-ui;
         background: #f06d06;
         color: white;
         text-align: center;
         }
         button {
         padding: 5px 15px;
         float: left;
         border-radius: 25%;
         border: 1px ;
         background: linear-gradient(135deg, var(--accent), #9333ea);
         color: white;
         cursor: pointer;
         display: flex;
         align-items: center;
         justify-content: center;
         transition: all 0.2s ease;
         flex-shrink: 3px;
         }
         *,
         *::before,
         *::after {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         }
         :root {
         --bg-primary: #0a0a0f;
         --bg-secondary: #12121a;
         --bg-card: #1a1a2e;
         --bg-card-hover: #222240;
         --accent: #7c3aed;
         --accent-light: #a78bfa;
         --accent-glow: rgba(124, 58, 237, 0.3);
         --text-primary: #f0f0f5;
         --text-secondary: #9090a8;
         --border: #2a2a40;
         --success: #10b981;
         --warning: #f59e0b;
         }
         body {
         font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
         background: var(--bg-primary);
         color: var(--text-primary);
         min-height: 100vh;
         display: block;
         flex-direction: column;
         align-items: center;
         padding: 2rem 1rem;
         overflow-x: hidden;
         }
         .container {
         max-width: 900px;
         width: 100%;
         }
      </style>
   </head>
   <body>
      <header>
         <h3 class="header"> Play random WAV/MP3/OGG parts <br>
            using the Audio Tag
         </h3>
      </header>
      <div class="container">
         <div class="">
            <input type="file" id="fileInput" accept="audio/*">
         </div>
         <hr />
      </div>
      <script>
         let fileInput = document.getElementById("fileInput");
         fileInput.addEventListener("change", function (event) {
         let file = event.target.files[0];
         let reader = new FileReader();
         
         reader.onload = function (event) {
           let audioContext = new (window.AudioContext || window.webkitAudioContext)();
           let source = audioContext.createBufferSource();
         
           audioContext.decodeAudioData(event.target.result, function (buffer) {
             source.buffer = buffer;
             source.connect(audioContext.destination);
             source.loop = true;
             //source.start();
             source.start(audioContext.currentTime, 1.1, 2);
         
             let audioPlayer = document.createElement("audio");
             audioPlayer.controls = true;
             audioPlayer.src = URL.createObjectURL(file);
             document.body.appendChild(audioPlayer);
         
             let play = (startTime, duration) => {
               const source = audioContext.createBufferSource();
               source.buffer = buffer;
               source.connect(audioContext.destination);
               source.start(audioContext.currentTime, startTime, duration);
             };
         
             let space = document.createElement("hr");
             document.body.append(space);
         
             [0, 1, 3, 5, 10, 15, 18].forEach((startTime) => {
               let btn = document.createElement("button");
               btn.onclick = (evt) => play(startTime, 0.15);
               btn.textContent = "start at " + startTime + "s";
               document.body.append(btn);
             });
         
             space = document.createElement("hr");
             document.body.append(space);
         
             let items = Array.from(
               {
                 length: 20
               },
               () => Math.floor(Math.random() * 20)
             );
         
             items.forEach((startTime) => {
               let btn2 = document.createElement("button");
               btn2.onclick = (evt) => play(startTime, 0.15);
               btn2.textContent = "start at " + startTime + "s";
               document.body.append(btn2);
             });
         
             space = document.createElement("hr");
             document.body.append(space);
           });
         };
         
         reader.readAsArrayBuffer(file);
         });
         
      </script>
   </body>
</html>
