<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassette Tape Poster - Sunset Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Oswald:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5e6d8;
    font-family: 'Oswald', sans-serif;
  }

  .poster {
    width: 500px;
    height: 700px;
    background: repeating-linear-gradient(
      45deg,
      #ffd9b8,
      #ffd9b8 20px,
      #ffc0a0 20px,
      #ffc0a0 40px,
      #ffa88a 40px,
      #ffa88a 60px,
      #ff9070 60px,
      #ff9070 80px,
      #ffb89a 80px,
      #ffb89a 100px
    );
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(180, 100, 60, 0.25),
      0 0 80px rgba(255, 160, 100, 0.15);
    border: 1px solid #f0c8a8;
  }

  .poster::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,200,150,0.1));
    pointer-events: none;
  }

  /* Subtle grain overlay */
  .poster::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-radial-gradient(circle at 0 0, transparent 0, rgba(255,255,255,0.04) 1px, transparent 2px);
    pointer-events: none;
    opacity: 0.6;
  }

  .title {
    font-family: 'Righteous', cursive;
    font-size: 42px;
    color: #6b3020;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow:
      2px 2px 0 rgba(255, 220, 180, 0.8),
      4px 4px 0 rgba(255, 180, 140, 0.5);
    margin-bottom: 10px;
    z-index: 1;
  }

  .subtitle {
    font-size: 14px;
    color: #8a4030;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 rgba(255,220,180,0.6);
    margin-bottom: 30px;
    z-index: 1;
  }

  /* CASSETTE TAPE - Light Warm Edition */
  .cassette {
    width: 340px;
    height: 220px;
    background: linear-gradient(180deg, #fff5e8 0%, #f8e8d0 50%, #f0dcc0 100%);
    border-radius: 14px;
    position: relative;
    z-index: 1;
    box-shadow:
      0 10px 40px rgba(180, 100, 60, 0.25),
      0 0 30px rgba(255, 180, 120, 0.2),
      inset 0 1px 2px rgba(255,255,255,0.8),
      inset 0 -2px 6px rgba(200, 140, 100, 0.15);
    border: 1px solid #e8c8a8;
  }

  /* Top edge highlight */
  .cassette::before {
    content: '';
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    border-radius: 0 0 4px 4px;
  }

  /* Label area - Soft peach */
  .label {
    position: absolute;
    top: 18px;
    left: 30px;
    right: 30px;
    height: 90px;
    background: linear-gradient(180deg, #fff0e0 0%, #ffe0c8 100%);
    border-radius: 6px;
    border: 1px solid #e8a878;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(200, 120, 80, 0.15);
  }

  .label::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 11px,
      rgba(230, 130, 90, 0.25) 11px,
      rgba(230, 130, 90, 0.25) 12px
    );
  }

  .label-title {
    font-family: 'Righteous', cursive;
    font-size: 16px;
    color: #a84830;
    letter-spacing: 3px;
    z-index: 1;
    text-shadow: 0 0 8px rgba(255, 180, 120, 0.4);
  }

  .label-lines {
    z-index: 1;
    margin-top: 6px;
    text-align: center;
  }

  .label-lines span {
    display: block;
    font-size: 9px;
    color: #a86040;
    letter-spacing: 1px;
    line-height: 1.6;
  }

  /* Tape window - Warm cream */
  .tape-window {
    position: absolute;
    top: 118px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 50px;
    background: linear-gradient(180deg, #f5d8b8 0%, #e8c8a0 100%);
    border-radius: 25px;
    border: 2px solid #d8a878;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow:
      inset 0 2px 6px rgba(180, 120, 80, 0.25),
      0 0 15px rgba(255, 180, 120, 0.2);
  }

  /* Reels - Warm terracotta */
  .reel {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #e8a878 0%, #c87848 40%, #a85830 100%);
    border: 2px solid #d89060;
    position: relative;
    box-shadow:
      inset 0 0 6px rgba(120, 60, 30, 0.4),
      0 0 6px rgba(255, 160, 100, 0.3);
  }

  .reel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f0c090;
    border: 1px solid #e8b080;
    box-shadow: inset 0 0 3px rgba(180, 100, 60, 0.3);
  }

  .reel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #a85830;
  }

  .reel-left {
    animation: spin 3s linear infinite;
  }

  .reel-right {
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Tape between reels */
  .tape-path {
    flex: 1;
    height: 2px;
    background: #a86840;
    margin: 0 4px;
    opacity: 0.7;
    box-shadow: 0 0 3px rgba(180, 100, 60, 0.3);
  }

  /* Bottom section */
  .bottom-section {
    position: absolute;
    bottom: 14px;
    left: 30px;
    right: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tape-hole {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, #f5d8b8 0%, #e8c8a0 60%, #d8b888 100%);
    border: 2px solid #d8a878;
    box-shadow:
      inset 0 1px 3px rgba(180, 120, 80, 0.3),
      0 0 4px rgba(255, 180, 120, 0.2);
  }

  .bottom-teeth {
    display: flex;
    gap: 3px;
  }

  .tooth {
    width: 6px;
    height: 10px;
    background: linear-gradient(180deg, #f0dcc0 0%, #e8c8a8 100%);
    border-radius: 2px;
    border: 1px solid #d8a878;
  }

  /* Screws - Warm bronze */
  .screw {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8b080, #c08050);
    border: 1px solid #b87848;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4);
  }

  .screw::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 6px;
    height: 1.5px;
    background: #8a5030;
  }

  .screw-tl { top: 8px; left: 10px; }
  .screw-tr { top: 8px; right: 10px; }
  .screw-bl { bottom: 8px; left: 10px; }
  .screw-br { bottom: 8px; right: 10px; }

  /* Footer text */
  .footer-text {
    margin-top: 30px;
    font-size: 12px;
    color: #8a4030;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 rgba(255,220,180,0.6);
    z-index: 1;
    opacity: 0.9;
  }

  .year {
    font-family: 'Righteous', cursive;
    font-size: 20px;
    color: #a84830;
    letter-spacing: 4px;
    text-shadow:
      2px 2px 0 rgba(255, 220, 180, 0.7),
      0 0 12px rgba(255, 160, 100, 0.3);
    margin-top: 6px;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="poster">
  <div class="title">Mixtape</div>
  <div class="subtitle">Side A · Stereo</div>

  <div class="cassette">
    <div class="screw screw-tl"></div>
    <div class="screw screw-tr"></div>
    <div class="screw screw-bl"></div>
    <div class="screw screw-br"></div>

    <div class="label">
      <div class="label-title">★ Mixtape ★</div>
      <div class="label-lines">
        <span>01. Golden Hour</span>
        <span>02. Peach Sky</span>
        <span>03. Warm Breeze</span>
      </div>
    </div>

    <div class="tape-window">
      <div class="reel reel-left"></div>
      <div class="tape-path"></div>
      <div class="reel reel-right"></div>
    </div>

    <div class="bottom-section">
      <div class="tape-hole"></div>
      <div class="bottom-teeth">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>
      <div class="tape-hole"></div>
    </div>
  </div>

  <div class="footer-text">Press Play</div>
  <div class="year">— 2026 —</div>
</div>

</body>
</html>
