<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Wall Calculator — Retro Poster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    padding: 20px;
  }

  .poster {
    width: 600px;
    height: 850px;
    background: linear-gradient(180deg, #d9c9a3 0%, #c4b083 60%, #8a7550 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 0 8px #2a2018;
    border: 2px solid #2a2018;
  }

  /* Title banner */
  .title {
    position: absolute;
    top: 30px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title h1 {
    font-size: 38px;
    letter-spacing: 6px;
    color: #2a2018;
    font-weight: 900;
    text-shadow: 2px 2px 0 #d9c9a3;
  }
  .title p {
    font-size: 11px;
    letter-spacing: 4px;
    color: #5a4528;
    margin-top: 6px;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 130px;
    left: 40px;
    right: 40px;
    height: 440px;
    background:
      repeating-linear-gradient(90deg, transparent 0, transparent 98px, rgba(0,0,0,0.08) 98px, rgba(0,0,0,0.08) 100px),
      repeating-linear-gradient(0deg, transparent 0, transparent 98px, rgba(0,0,0,0.08) 98px, rgba(0,0,0,0.08) 100px),
      linear-gradient(180deg, #b89f6e, #9a825a);
    border: 3px solid #3a2a18;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.3);
  }

  /* Wall calculator machine - main panel */
  .calculator {
    position: absolute;
    top: 160px;
    left: 70px;
    width: 260px;
    height: 380px;
    background: linear-gradient(180deg, #3a3a3a, #1f1f1f);
    border: 4px solid #0a0a0a;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
  }

  .calc-screen {
    margin: 20px 20px 15px;
    height: 50px;
    background: #0a2a1a;
    border: 2px solid #000;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    color: #4aff8a;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 6px #4aff8a;
    box-shadow: inset 0 0 10px rgba(74,255,138,0.3);
  }

  .calc-label {
    margin: 0 20px 8px;
    color: #c0c0c0;
    font-size: 9px;
    letter-spacing: 2px;
  }

  /* Button grid */
  .buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 0 20px;
    margin-bottom: 15px;
  }
  .btn {
    height: 22px;
    background: linear-gradient(180deg, #555, #2a2a2a);
    border: 1px solid #000;
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn.red { background: linear-gradient(180deg, #c03030, #701818); }
  .btn.green { background: linear-gradient(180deg, #30a050, #186030); }
  .btn.amber { background: linear-gradient(180deg, #d09030, #804818); }

  /* Indicator lights */
  .lights {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    justify-content: center;
  }
  .light {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #300;
    border: 1px solid #000;
  }
  .light.on {
    background: radial-gradient(circle at 30% 30%, #ff6060, #c00000);
    box-shadow: 0 0 8px #ff3030;
    animation: blink 2s infinite;
  }
  .light.on2 {
    background: radial-gradient(circle at 30% 30%, #ffd060, #c08000);
    box-shadow: 0 0 8px #ffa030;
    animation: blink 3s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Reel-to-reel unit */
  .reel-unit {
    position: absolute;
    top: 170px;
    right: 60px;
    width: 200px;
    height: 360px;
    background: linear-gradient(180deg, #4a3828, #2a1f14);
    border: 4px solid #0a0a0a;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  .reel-unit-label {
    text-align: center;
    color: #d4b878;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 10px;
  }

  .reel {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background:
      radial-gradient(circle, #1a1a1a 15%, transparent 16%),
      repeating-radial-gradient(circle, #2a2a2a 0, #2a2a2a 2px, #1a1a1a 2px, #1a1a1a 4px),
      radial-gradient(circle, #0a0a0a 30%, #3a3a3a 100%);
    border: 3px solid #0a0a0a;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.5);
    animation: spin 4s linear infinite;
  }
  .reel.left { top: 40px; left: 40px; }
  .reel.right { top: 40px; right: 40px; animation-direction: reverse; }

  .reel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 30px;
    height: 30px;
    background: #5a5a5a;
    border: 2px solid #000;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .reel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.1);
    transform: translate(-50%, -50%);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Tape path */
  .tape-path {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 20px;
    background: #1a0a00;
    border-top: 2px solid #3a1a00;
    border-bottom: 2px solid #3a1a00;
  }

  /* VU meters */
  .vu-meters {
    position: absolute;
    bottom: 40px;
    left: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .vu {
    width: 70px;
    height: 35px;
    background: linear-gradient(180deg, #f0e0b0, #d0b070);
    border: 2px solid #000;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .vu::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 2px;
    height: 30px;
    background: #c00;
    transform-origin: bottom center;
    animation: vu-move 1.5s ease-in-out infinite;
  }
  .vu:nth-child(2)::after { animation-delay: 0.3s; }
  @keyframes vu-move {
    0%, 100% { transform: translateX(-50%) rotate(-30deg); }
    50% { transform: translateX(-50%) rotate(30deg); }
  }

  /* Floor */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 280px;
    background:
      repeating-linear-gradient(90deg, #3a2a18 0, #3a2a18 50px, #2a1f10 50px, #2a1f10 100px),
      linear-gradient(180deg, #4a3520, #1a1008);
    border-top: 3px solid #0a0a0a;
  }

  /* Person silhouette */
  .person {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 340px;
    z-index: 5;
  }

  /* Head */
  .head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 55px;
    height: 65px;
    background: radial-gradient(ellipse at 50% 40%, #2a1a10, #0a0505);
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .head::before {
    content: '';
    position: absolute;
    top: -8px;
    left: -3px;
    right: -3px;
    height: 30px;
    background: #0a0505;
    border-radius: 50% 50% 20% 20%;
  }

  /* Neck */
  .neck {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 15px;
    background: #1a0f08;
  }

  /* Torso */
  .torso {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 130px;
    background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
    border-radius: 10px 10px 5px 5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  .torso::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 110px;
    background: #2a2a2a;
  }

  /* Arms */
  .arm {
    position: absolute;
    top: 80px;
    width: 22px;
    height: 130px;
    background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
    border-radius: 10px;
  }
  .arm.left { left: 12px; transform: rotate(6deg); }
  .arm.right { right: 12px; transform: rotate(-6deg); }

  /* Legs */
  .leg {
    position: absolute;
    top: 195px;
    width: 30px;
    height: 140px;
    background: linear-gradient(180deg, #0a0a0a, #000);
    border-radius: 5px;
  }
  .leg.left { left: 35px; }
  .leg.right { right: 35px; }

  /* Shoes */
  .shoe {
    position: absolute;
    bottom: -5px;
    width: 38px;
    height: 15px;
    background: #000;
    border-radius: 8px 15px 5px 5px;
  }
  .leg.left .shoe { left: -4px; }
  .leg.right .shoe { right: -4px; }

  /* Cable on floor */
  .cable {
    position: absolute;
    bottom: 40px;
    left: 80px;
    width: 180px;
    height: 3px;
    background: #0a0a0a;
    border-radius: 2px;
    transform: rotate(-5deg);
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    color: #d4b878;
    font-size: 10px;
    letter-spacing: 5px;
    z-index: 8;
  }

  /* Grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.15) 0, transparent 50%);
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="title">
      <h1>THE WALL CALCULATOR</h1>
      <p>— MAINFRAME ERA · EST. 1968 —</p>
    </div>

    <div class="wall"></div>

    <!-- Wall calculator machine -->
    <div class="calculator">
      <div class="calc-screen">0047291</div>
      <div class="calc-label">MODEL · MK-VII</div>
      <div class="buttons">
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn red"></div><div class="btn green"></div><div class="btn amber"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn amber"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn red"></div><div class="btn"></div>
      </div>
      <div class="lights">
        <div class="light on"></div>
        <div class="light on2"></div>
        <div class="light on"></div>
        <div class="light"></div>
        <div class="light on2"></div>
        <div class="light on"></div>
      </div>
    </div>

    <!-- Reel-to-reel unit -->
    <div class="reel-unit">
      <div class="reel-unit-label">MAGNETIC TAPE · REC</div>
      <div class="reel left"></div>
      <div class="reel right"></div>
      <div class="tape-path"></div>
      <div class="vu-meters">
        <div class="vu"></div>
        <div class="vu"></div>
      </div>
    </div>

    <div class="floor"></div>
    <div class="cable"></div>

    <!-- Person -->
    <div class="person">
      <div class="head"></div>
      <div class="neck"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="torso"></div>
      <div class="leg left"><div class="shoe"></div></div>
      <div class="leg right"><div class="shoe"></div></div>
    </div>

    <div class="footer">◈ COMPUTING · REDEFINED ◈</div>
    <div class="grain"></div>
  </div>
</body>
</html>
