<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassette Tape Poster - Dark Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Oswald:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    font-family: 'Oswald', sans-serif;
  }

  .poster {
    width: 500px;
    height: 700px;
    background: repeating-linear-gradient(
      45deg,
      #1a0f1a,
      #1a0f1a 20px,
      #0d1a1a 20px,
      #0d1a1a 40px,
      #1a1a0d 40px,
      #1a1a0d 60px,
      #1a0d0d 60px,
      #1a0d0d 80px,
      #0d0d1a 80px,
      #0d0d1a 100px
    );
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.8),
      0 0 80px rgba(139, 92, 246, 0.15);
    border: 1px solid #2a2a35;
  }

  .poster::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.6) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.5));
    pointer-events: none;
  }

  /* Subtle grain overlay */
  .poster::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-radial-gradient(circle at 0 0, transparent 0, rgba(255,255,255,0.02) 1px, transparent 2px);
    pointer-events: none;
    opacity: 0.5;
  }

  .title {
    font-family: 'Righteous', cursive;
    font-size: 42px;
    color: #e8e8f0;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow:
      0 0 10px rgba(139, 92, 246, 0.6),
      0 0 20px rgba(139, 92, 246, 0.3),
      3px 3px 0 #2a1a3a,
      6px 6px 0 rgba(0,0,0,0.6);
    margin-bottom: 10px;
    z-index: 1;
  }

  .subtitle {
    font-size: 14px;
    color: #a8a8b8;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    margin-bottom: 30px;
    z-index: 1;
  }

  /* CASSETTE TAPE - Dark Edition */
  .cassette {
    width: 340px;
    height: 220px;
    background: linear-gradient(180deg, #2a2a32 0%, #1a1a22 50%, #0f0f15 100%);
    border-radius: 14px;
    position: relative;
    z-index: 1;
    box-shadow:
      0 10px 40px rgba(0,0,0,0.7),
      0 0 30px rgba(139, 92, 246, 0.1),
      inset 0 1px 2px rgba(255,255,255,0.08),
      inset 0 -2px 6px rgba(0,0,0,0.5);
    border: 1px solid #3a3a45;
  }

  /* Top edge highlight */
  .cassette::before {
    content: '';
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    border-radius: 0 0 4px 4px;
  }

  /* Label area - Dark */
  .label {
    position: absolute;
    top: 18px;
    left: 30px;
    right: 30px;
    height: 90px;
    background: linear-gradient(180deg, #1a1520 0%, #0f0a15 100%);
    border-radius: 6px;
    border: 1px solid #4a3a5a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
  }

  .label::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 11px,
      rgba(139, 92, 246, 0.15) 11px,
      rgba(139, 92, 246, 0.15) 12px
    );
  }

  .label-title {
    font-family: 'Righteous', cursive;
    font-size: 16px;
    color: #d4a8ff;
    letter-spacing: 3px;
    z-index: 1;
    text-shadow: 0 0 8px rgba(139, 92, 246, 0.5);
  }

  .label-lines {
    z-index: 1;
    margin-top: 6px;
    text-align: center;
  }

  .label-lines span {
    display: block;
    font-size: 9px;
    color: #8a7a9a;
    letter-spacing: 1px;
    line-height: 1.6;
  }

  /* Tape window - Darker */
  .tape-window {
    position: absolute;
    top: 118px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 50px;
    background: linear-gradient(180deg, #050508 0%, #0a0a10 100%);
    border-radius: 25px;
    border: 2px solid #3a3a45;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow:
      inset 0 2px 10px rgba(0,0,0,0.9),
      0 0 15px rgba(139, 92, 246, 0.1);
  }

  /* Reels - Dark metallic */
  .reel {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #4a4a55 0%, #2a2a35 40%, #1a1a22 100%);
    border: 2px solid #5a5a65;
    position: relative;
    box-shadow:
      inset 0 0 8px rgba(0,0,0,0.9),
      0 0 6px rgba(139, 92, 246, 0.2);
  }

  .reel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #6a6a75;
    border: 1px solid #7a7a85;
    box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
  }

  .reel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #2a2a35;
  }

  .reel-left {
    animation: spin 3s linear infinite;
  }

  .reel-right {
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Tape between reels - darker brown */
  .tape-path {
    flex: 1;
    height: 2px;
    background: #3a2a1a;
    margin: 0 4px;
    opacity: 0.8;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);
  }

  /* Bottom section */
  .bottom-section {
    position: absolute;
    bottom: 14px;
    left: 30px;
    right: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tape-hole {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, #050508 0%, #0a0a10 60%, #1a1a22 100%);
    border: 2px solid #3a3a45;
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,0.9),
      0 0 4px rgba(139, 92, 246, 0.1);
  }

  .bottom-teeth {
    display: flex;
    gap: 3px;
  }

  .tooth {
    width: 6px;
    height: 10px;
    background: linear-gradient(180deg, #3a3a45 0%, #2a2a32 100%);
    border-radius: 2px;
    border: 1px solid #4a4a55;
  }

  /* Screws - Dark metallic */
  .screw {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #5a5a65, #2a2a32);
    border: 1px solid #4a4a55;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  .screw::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 6px;
    height: 1.5px;
    background: #1a1a22;
  }

  .screw-tl { top: 8px; left: 10px; }
  .screw-tr { top: 8px; right: 10px; }
  .screw-bl { bottom: 8px; left: 10px; }
  .screw-br { bottom: 8px; right: 10px; }

  /* Footer text */
  .footer-text {
    margin-top: 30px;
    font-size: 12px;
    color: #a8a8b8;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow:
      1px 1px 0 rgba(0,0,0,0.8),
      0 0 8px rgba(139, 92, 246, 0.3);
    z-index: 1;
    opacity: 0.9;
  }

  .year {
    font-family: 'Righteous', cursive;
    font-size: 20px;
    color: #d4a8ff;
    letter-spacing: 4px;
    text-shadow:
      2px 2px 0 rgba(0,0,0,0.6),
      0 0 12px rgba(139, 92, 246, 0.5);
    margin-top: 6px;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="poster">
  <div class="title">Mixtape</div>
  <div class="subtitle">Side A · Stereo</div>

  <div class="cassette">
    <div class="screw screw-tl"></div>
    <div class="screw screw-tr"></div>
    <div class="screw screw-bl"></div>
    <div class="screw screw-br"></div>

    <div class="label">
      <div class="label-title">★ Mixtape ★</div>
      <div class="label-lines">
        <span>01. Midnight Static</span>
        <span>02. Shadow Frequency</span>
        <span>03. Neon Ghosts</span>
      </div>
    </div>

    <div class="tape-window">
      <div class="reel reel-left"></div>
      <div class="tape-path"></div>
      <div class="reel reel-right"></div>
    </div>

    <div class="bottom-section">
      <div class="tape-hole"></div>
      <div class="bottom-teeth">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>
      <div class="tape-hole"></div>
    </div>
  </div>

  <div class="footer-text">Press Play</div>
  <div class="year">— 2026 —</div>
</div>

</body>
</html>
