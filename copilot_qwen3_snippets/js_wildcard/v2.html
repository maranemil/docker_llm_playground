<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildcard Flip</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/latin.css" rel="stylesheet">
    <!-- create a wildcard flip game in simple html javascript -->
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-back: #1e293b;
            --card-front: #f8fafc;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --gold: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top left, #2e1065, var(--bg-dark));
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        /* HUD */
        .hud {
            display: flex;
            gap: 1.5rem;
            background: var(--glass);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
        }

        /* Game Board */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
            margin-bottom: 2rem;
        }

        .card {
            width: 80px;
            height: 100px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched {
            animation: pulseMatch 0.5s ease;
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
        }

        .card-front {
            background: var(--card-back);
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .card-back {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-color: rgba(139, 92, 246, 0.3);
            display: flex;
        }
        
        .card-back::after {
            content: "✦";
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .card:hover:not(.flipped) .card-back {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Wildcard Styling */
        .card-front.wildcard {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .card-front.wildcard::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 14px;
            border: 2px dashed rgba(255,255,255,0.5);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--glass);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--gold);
        }

        .modal p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .final-score {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to right, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin: 1rem 0;
        }

        @keyframes pulseMatch {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @media (max-width: 500px) {
            .card { width: 65px; height: 85px; }
            .card-face { font-size: 2rem; }
            #game-board { gap: 10px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <h1>Wildcard Flip</h1>

    <div class="hud">
        <div class="stat">
            <span class="stat-label">Time</span>
            <span class="stat-value" id="timer">00:00</span>
        </div>
        <div class="stat">
            <span class="stat-label">Moves</span>
            <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
        </div>
    </div>

    <div id="game-board"></div>

    <div class="controls">
        <button class="btn-primary" onclick="restartGame()">Restart Game</button>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victory-modal">
        <div class="modal-content">
            <h2>You Won!</h2>
            <p>You found all the matches, even the wildcards!</p>
            <span class="final-score" id="final-score">0</span>
            <button class="btn-primary" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const SYMBOLS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        // We use 7 pairs + 2 Wildcards = 16 cards
        // Wildcard symbol is ✨
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let score = 0;
        let timer = 0;
        let timerInterval = null;
        let matchedPairs = 0;
        const totalPairs = 8;

        const dom = {
            board: document.getElementById('game-board'),
            timer: document.getElementById('timer'),
            moves: document.getElementById('moves'),
            score: document.getElementById('score'),
            modal: document.getElementById('victory-modal'),
            finalScore: document.getElementById('final-score')
        };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            // Create deck
            // 7 pairs of symbols
            let deck = [];
            SYMBOLS.slice(0, 7).forEach(sym => {
                deck.push({ symbol: sym, type: 'normal' });
                deck.push({ symbol: sym, type: 'normal' });
            });
            // 2 Wildcards
            deck.push({ symbol: '✨', type: 'wildcard' });
            deck.push({ symbol: '✨', type: 'wildcard' });

            cards = shuffle(deck);
            
            dom.board.innerHTML = '';
            cards.forEach((item, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;
                cardEl.dataset.symbol = item.symbol;
                cardEl.dataset.type = item.type;

                cardEl.innerHTML = `
                    <div class="card-face card-front ${item.type === 'wildcard' ? 'wildcard' : ''}">${item.symbol}</div>
                    <div class="card-face card-back"></div>
                `;

                cardEl.addEventListener('click', flipCard);
                dom.board.appendChild(cardEl);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            if (moves === 0 && timerInterval === null) {
                startTimer();
            }

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            dom.moves.textContent = moves;
        }

        function checkForMatch() {
            let isMatch = false;

            // Logic:
            // 1. Standard match: Symbols are same AND neither are wildcards (handled below)
            // 2. Wildcard match: One is wildcard, other is not.
            // 3. Double Wildcard: Both are wildcards.
            
            const type1 = firstCard.dataset.type;
            const type2 = secondCard.dataset.type;
            const sym1 = firstCard.dataset.symbol;
            const sym2 = secondCard.dataset.symbol;

            if (type1 === 'wildcard' || type2 === 'wildcard') {
                // If either is a wildcard, it matches everything.
                // Exception: We need to ensure we aren't matching against itself (handled by UI logic mostly, but good to be safe)
                // Actually, if firstCard is Wildcard, and secondCard is Wildcard -> Match.
                // If firstCard is Wildcard, secondCard is Cat -> Match.
                isMatch = true;
            } else {
                // Standard check
                isMatch = sym1 === sym2;
            }

            if (isMatch) {
                disableCards();
                calculateScore();
            } else {
                unflipCards();
            }
        }

        function calculateScore() {
            // Base score per match: 100
            // Bonus if time < 60s
            let matchScore = 100;
            if (timer < 60) matchScore += 50;
            
            score += matchScore;
            dom.score.textContent = score;
            matchedPairs++;

            if (matchedPairs === totalPairs) {
                setTimeout(endGame, 800);
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            // Add points for speed bonus visual flair
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                dom.timer.textContent = formatTime(timer);
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            timerInterval = null;
            dom.finalScore.textContent = score;
            dom.modal.classList.add('active');
        }

        function restartGame() {
            clearInterval(timerInterval);
            timer = 0;
            moves = 0;
            score = 0;
            matchedPairs = 0;
            timerInterval = null;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;

            dom.timer.textContent = '00:00';
            dom.moves.textContent = '0';
            dom.score.textContent = '0';
            dom.modal.classList.remove('active');

            initGame();
        }

        // Start on load
        initGame();

    </script>
</body>
</html>
